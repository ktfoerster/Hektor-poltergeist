name: K11122 exact search
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['k11122/**', '.github/workflows/k11122.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: k11122-${{ github.ref }}
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [0, 3]
        branch: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install solver
        run: python -m pip install z3-solver==4.13.3.0
      - name: Test semantics and partition coverage
        run: python -m unittest discover -s k11122 -p 'test_*.py' -v
      - name: Merge both prior branches and resume
        env:
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ matrix.branch }}
        run: |
          python k11122/merge_checkpoints.py --target "$TARGET" --output resume/merged.json
          python k11122/search.py --target "$TARGET" --branch "$BRANCH" --seconds 1200 --solve-seconds 60 --resume resume/merged.json --output "results/t$TARGET-b$BRANCH"
      - name: Preserve results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k11122-target-${{ matrix.target }}-branch-${{ matrix.branch }}-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
