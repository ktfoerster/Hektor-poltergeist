name: K11122 exact search
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['k11122/**', '.github/workflows/k11122.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: k11122-${{ github.ref }}
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [0, 3]
        branch: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install solver
        run: python -m pip install z3-solver==4.13.3.0
      - name: Test semantics and partition coverage
        run: python -m unittest discover -s k11122 -p 'test_*.py' -v
      - name: Recover original accumulated constraints
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41140359924
          name: k11122-target-${{ matrix.target }}-41140359924
          path: resume
      - name: Validate recovered checkpoint and resume
        env:
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ matrix.branch }}
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,os,subprocess,sys
          matches=list(pathlib.Path('resume').rglob('checkpoint.json'))
          if len(matches)!=1: raise SystemExit('Expected exactly one checkpoint')
          path=matches[0]
          hashes=json.loads((path.parent/'SHA256.json').read_text())
          if hashlib.sha256(path.read_bytes()).hexdigest()!=hashes['checkpoint.json']:
              raise SystemExit('Checkpoint integrity mismatch')
          cp=json.loads(path.read_text()); target=int(os.environ['TARGET'])
          expected={0:884,3:724}[target]
          if cp['target']!=target or len(cp['masks'])!=expected:
              raise SystemExit('Unexpected baseline checkpoint')
          subprocess.run([sys.executable,'k11122/search.py','--target',str(target),
              '--branch',os.environ['BRANCH'],'--seconds','1200','--solve-seconds','60',
              '--resume',str(path),'--output',f'results/t{target}-b{os.environ["BRANCH"]}'],check=True)
          PY
      - name: Preserve results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k11122-target-${{ matrix.target }}-branch-${{ matrix.branch }}-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
