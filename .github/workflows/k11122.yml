name: K11122 Boolean SAT search
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['k11122/**', '.github/workflows/k11122.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: k11122-${{ github.ref }}
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {target: 0, branch: 0, backend: cadical195, seed: 20261201, phase: k11122/phase-seeds/t0-b0.tsv}
          - {target: 0, branch: 1, backend: cadical195, seed: 20261202, phase: k11122/phase-seeds/t0-b1.tsv}
          - {target: 3, branch: 0, backend: cadical195, seed: 20261231, phase: k11122/phase-seeds/t3-b0.tsv}
          - {target: 3, branch: 1, backend: cadical195, seed: 20261232, phase: k11122/phase-seeds/t3-b1.tsv}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned solvers
        run: python -m pip install z3-solver==4.13.3.0 python-sat==1.8.dev24
      - name: Test semantics and partition coverage
        run: python -m unittest discover -s k11122 -p 'test_*.py' -v
      - name: Merge prior counterexamples and run bounded Boolean SAT
        env:
          TARGET: ${{ matrix.target }}
          BRANCH: ${{ matrix.branch }}
          BACKEND: ${{ matrix.backend }}
          SEED: ${{ matrix.seed }}
          PHASE: ${{ matrix.phase }}
        run: |
          (cd k11122/phase-seeds && sha256sum -c SHA256SUMS)
          python k11122/merge_checkpoints.py --target "$TARGET" --output resume/merged.json
          python k11122/sat_search.py --target "$TARGET" --branch "$BRANCH" --backend "$BACKEND" --seed "$SEED" --phase-policy "$PHASE" --seconds 1200 --solve-seconds 1200 --conflicts 200000 --resume resume/merged.json --output "results/t$TARGET-b$BRANCH"
      - name: Preserve results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k11122-cnf-target-${{ matrix.target }}-branch-${{ matrix.branch }}-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

